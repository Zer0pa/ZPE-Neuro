name: Verify Package Surface

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel import surface
        run: |
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import zpe_neuro
          print(sorted(zpe_neuro.__all__))
          PY
      - name: Run repo-local unit tests
        run: |
          python -m venv .venv-dev
          . .venv-dev/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest tests

  gate-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gate,dev]'
      - name: Run Gate C and Gate D sequentially
        run: |
          python tools/run_gate_c.py --artifact-root artifacts/ci_gate_surface --seed 20260220
          python tools/run_gate_d.py --artifact-root artifacts/ci_gate_surface --replay-seeds 20260220,20260221,20260222,20260223,20260224

  proof-import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[proof]'
      - name: Smoke-check replay imports
        run: |
          python - <<'PY'
          import h5py
          import remfile
          from dandi.dandiapi import DandiAPIClient
          from pynwb import NWBHDF5IO
          import spikeinterface
          print("proof import surface ok")
          PY
