name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-distributions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels
          path: dist/
          if-no-files-found: error

  validate-zenodo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate Zenodo metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re

          target = pathlib.Path(".zenodo.json")
          if not target.exists():
              raise SystemExit("Missing .zenodo.json")
          payload = json.loads(target.read_text(encoding="utf-8"))
          required = ["title","creators","upload_type","description","keywords","license","related_identifiers"]
          missing = [f for f in required if not payload.get(f)]
          if missing:
              raise SystemExit("Missing required Zenodo fields: " + ", ".join(missing))

          license_text = pathlib.Path("LICENSE").read_text(encoding="utf-8")
          match = re.search(r"\*\*SPDX Identifier:\*\*\s+(.+)", license_text)
          if not match:
              raise SystemExit("Unable to read SPDX identifier from LICENSE")
          if payload["license"] != match.group(1):
              raise SystemExit(
                  f"Zenodo license {payload['license']} does not match LICENSE SPDX {match.group(1)}"
              )
          print(f"Validated {target}")
          PY

  publish:
    needs:
      - build-distributions
      - validate-zenodo
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/zpe-neuro
    permissions:
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
