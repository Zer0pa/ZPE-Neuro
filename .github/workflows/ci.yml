name: Offline Verify

on:
  push:
    branches:
      - main
      - codex/action-brief-execution
  pull_request:
  workflow_dispatch:

jobs:
  offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline verify stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,public,proof]'
      - name: Run offline verify
        run: make offline-verify
