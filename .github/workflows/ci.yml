name: Offline Verify

on:
  push:
    branches:
      - main
      - codex/action-brief-execution
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verify:
    permissions:
      contents: read
    uses: Zer0pa/workflows/.github/workflows/ci-python-pure.yml@d0188f05e8ff011723c7d5d8c3a766647aed762e
    with:
      python-versions: '["3.11"]'
      runs-on: ubuntu-24.04
      test-command: make offline-verify
      lint: false
      type-check: false
