[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-neuro"
version = "0.1.0"
description = "Deterministic 8-primitive codec for extracellular neural recordings with a curated proof surface."
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-Zer0pa-SAL-6.0"
license-files = ["LICENSE"]
authors = [{name = "Zer0pa"}]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gate = [
    "pynwb>=2.8",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
public = [
    "dandi>=0.69",
    "h5py>=3.10",
    "pynwb>=2.8",
    "remfile>=0.1.13",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
proof = [
    "dandi>=0.69",
    "h5py>=3.10",
    "pynwb>=2.8",
    "remfile>=0.1.13",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
ops = [
    "comet-ml>=3.49",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Neuro"
Repository = "https://github.com/Zer0pa/ZPE-Neuro"
Issues = "https://github.com/Zer0pa/ZPE-Neuro/issues"

[tool.setuptools.packages.find]
where = ["src"]
