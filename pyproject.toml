[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-neuro"
version = "0.1.0"
description = "Private staged repo for the ZPE Neuro Wave-1 package and curated proof surface."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Zer0pa (Pty) Ltd", email = "architects@zer0pa.ai" },
]
license = "LicenseRef-Zer0pa-SAL-7.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
]
keywords = [
    "neuroscience",
    "extracellular recording",
    "spike-event encoding",
    "nwb",
    "dandi",
    "ibl",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gate = [
    "pynwb>=2.8",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
public = [
    "dandi>=0.69",
    "h5py>=3.10",
    "pynwb>=2.8",
    "remfile>=0.1.13",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
proof = [
    "dandi>=0.69",
    "h5py>=3.10",
    "pynwb>=2.8",
    "remfile>=0.1.13",
    "scikit-learn>=1.6",
    "spikeinterface>=0.103.2",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Neuro"
Documentation = "https://github.com/Zer0pa/ZPE-Neuro#readme"
Repository = "https://github.com/Zer0pa/ZPE-Neuro"
Issues = "https://github.com/Zer0pa/ZPE-Neuro/issues"
Changelog = "https://github.com/Zer0pa/ZPE-Neuro/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
