[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-neuro"
version = "0.1.0"
description = "Private staged repo for the ZPE Neuro Wave-1 package and curated proof surface."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
proof = [
    "allensdk>=2.16",
    "pynwb>=2.8",
    "spikeinterface>=0.103.2",
    "wfdb>=4.1",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Neuro"
Repository = "https://github.com/Zer0pa/ZPE-Neuro"
Issues = "https://github.com/Zer0pa/ZPE-Neuro/issues"

[tool.setuptools.packages.find]
where = ["src"]
